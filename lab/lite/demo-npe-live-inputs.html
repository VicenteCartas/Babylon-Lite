<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>Babylon Lite - Demo: NPE Live Inputs</title>
        <style>
            :root {
                color-scheme: dark;
                --ink: #f3eee7;
                --muted: #aab5bd;
                --panel: #111820;
                --line: #33414a;
                --accent: #ffad42;
                --cool: #56c6bf;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #03070a;
            }
            body {
                color: var(--ink);
                font:
                    15px Georgia,
                    "Times New Roman",
                    serif;
                letter-spacing: 0;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            .controls {
                position: fixed;
                top: 18px;
                left: 18px;
                width: min(310px, calc(100vw - 36px));
                padding: 15px 16px 14px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: color-mix(in srgb, var(--panel) 92%, transparent);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
                backdrop-filter: blur(10px);
            }
            .heading {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 14px;
                margin-bottom: 11px;
            }
            .heading strong {
                color: var(--accent);
                font-size: 17px;
                font-weight: 700;
            }
            output {
                color: var(--cool);
                font-variant-numeric: tabular-nums;
            }
            input[type="range"] {
                width: 100%;
                height: 22px;
                margin: 0 0 9px;
                accent-color: var(--accent);
            }
            .toggle {
                display: flex;
                align-items: center;
                gap: 9px;
                color: var(--muted);
                cursor: pointer;
            }
            .toggle input {
                width: 17px;
                height: 17px;
                margin: 0;
                accent-color: var(--cool);
            }
            .loading {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                color: var(--ink);
                background: #03070a;
                font-weight: 600;
                transition: opacity 0.35s ease;
            }
            .loading.is-hidden {
                opacity: 0;
                pointer-events: none;
            }
            @media (max-width: 520px) {
                .controls {
                    top: 12px;
                    left: 12px;
                    width: calc(100vw - 24px);
                }
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <section class="controls" aria-label="Live particle input">
            <div class="heading"><strong>Live size</strong><output id="liveSizeValue" for="liveSize">0.75</output></div>
            <input id="liveSize" type="range" min="0.15" max="1.5" step="0.01" value="0.75" />
            <label class="toggle"><input id="animateSize" type="checkbox" checked />Animate value</label>
        </section>
        <div id="loading" class="loading" role="status">Compiling live inputs...</div>
        <script>
            (function () {
                var canvas = document.getElementById("renderCanvas");
                var loading = document.getElementById("loading");
                if (!canvas || !loading) return;
                function check() {
                    if (canvas.dataset.ready === "true" || canvas.dataset.error) {
                        loading.classList.add("is-hidden");
                        setTimeout(function () {
                            loading.remove();
                        }, 400);
                    }
                }
                new MutationObserver(check).observe(canvas, { attributes: true, attributeFilter: ["data-ready", "data-error"] });
                check();
            })();
        </script>
        <script type="module" src="/lite/bundle/demos/npe-live-inputs.js"></script>
    </body>
</html>
